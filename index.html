<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Kivotos-Dress-Up</title>
<style>
:root{--bg:#dff4ff;--panel:#f8fdff;--ink:#203746;--muted:#648092;--pink:#42a9d8;--pink2:#a9e1f7;--line:#c5e7f5;--navy:#24506a;--shadow:0 10px 30px #24506a14}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eaf9ff 0%,#cceeff 48%,#e8f7ff 100%);color:var(--ink);font-family:Inter,"Pretendard","Noto Sans KR",system-ui,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0} .app{max-width:1440px;margin:0 auto;padding:24px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:.23em;color:var(--pink);font-weight:900}.brand{font-size:clamp(24px,3vw,38px);font-weight:950;letter-spacing:-.05em;margin:3px 0}.sub{color:var(--muted);font-size:13px}.header-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.btn{padding:10px 14px;border-radius:12px;background:#fff;color:var(--ink);font-size:12px;font-weight:800;border:1px solid var(--line);box-shadow:0 2px 6px #4b34410a}.btn.primary{background:var(--pink);border-color:var(--pink);color:white}.btn.dark{background:var(--navy);border-color:var(--navy);color:white}.btn.danger{color:#a53b5d}.btn:disabled{opacity:.4;cursor:not-allowed}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.lang button{padding:10px 12px;font-size:12px;font-weight:850;background:transparent;color:var(--muted)}.lang button.active{background:var(--navy);color:#fff}
.name-input{width:200px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;background:#fff;color:var(--ink)}
.layout{display:grid;grid-template-columns:minmax(340px,1fr) 380px;gap:16px;align-items:stretch}.panel{background:var(--panel);border:1px solid #fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.panel-title{font-size:13px;font-weight:950;letter-spacing:.04em}.tiny{font-size:11px;color:var(--muted)}

.stage-panel{padding:16px;display:flex;flex-direction:column;min-height:730px}.stage-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.stage-title{font-size:15px;font-weight:950}.stage-title span{font-size:11px;color:var(--muted);font-weight:600;margin-left:8px}.canvas-wrap{position:relative;flex:1;min-height:560px;border:1px solid #c8e6f2;border-radius:17px;overflow:hidden;background-color:#f0faff;background-image:linear-gradient(45deg,#d9edf6 25%,transparent 25%),linear-gradient(-45deg,#d9edf6 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d9edf6 75%),linear-gradient(-45deg,transparent 75%,#d9edf6 75%);background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0;display:grid;place-items:center}
#preview{height:min(70vh,720px);max-width:100%;width:auto;aspect-ratio:var(--canvas-ratio, 2/3);object-fit:contain;display:block;filter:drop-shadow(0 8px 12px #513b4814);touch-action:none;cursor:default;user-select:none;-webkit-user-select:none}.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none}.empty-card{max-width:340px;background:#fffafbd9;border:1px solid #ead2dc;border-radius:16px;padding:22px;backdrop-filter:blur(4px)}.empty-card strong{font-size:15px;display:block;margin-bottom:7px}.empty-card p{font-size:12px;color:var(--muted);line-height:1.65;margin:0}
.canvas-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;color:var(--muted);font-size:11px}
.tip{margin-top:8px;font-size:11px;color:#4a7188;background:#eaf7fd;border-radius:10px;padding:8px 11px;line-height:1.55}
.transform{margin-top:12px;padding:12px 14px;background:#eaf7fd;border-radius:14px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.transform-head{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:#28536a}
.transform-head .lock{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;margin-left:auto}
.transform-head .btn{padding:6px 10px;font-size:11px;border-radius:9px}
.range label{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:5px}.range input{width:100%;accent-color:var(--pink)}

.ratio-controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:12px;padding:11px 13px;background:#eaf7fd;border:1px solid #c5e7f5;border-radius:13px;font-size:11px;color:#31586c}
.ratio-controls strong{font-size:12px}.ratio-controls select,.ratio-controls input{border:1px solid #b9ddeb;border-radius:8px;padding:6px 7px;background:#fff;color:#203746;font-size:11px}
.ratio-controls input{width:76px}.ratio-controls label{display:flex;align-items:center;gap:5px}
.layer-panel{margin-top:12px;padding:12px 13px;background:#f4fbff;border:1px solid #cdeaf6;border-radius:14px}
.layer-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:#28536a}
.layer-list{display:grid;gap:6px}.layer-row{display:flex;align-items:center;gap:7px;padding:7px 8px;background:#fff;border:1px solid #d5edf7;border-radius:9px;font-size:11px}
.layer-row.sel{border-color:var(--pink);background:#effaff}
.layer-row .layer-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:750;cursor:pointer}
.layer-row button{background:#eaf7fd;color:#28536a;border-radius:7px;padding:5px 8px;font-size:10px;font-weight:800}
.layer-row button:disabled{opacity:.35;cursor:default}.layer-empty{font-size:11px;color:#718b9a;padding:8px}
.right-panel{display:flex;flex-direction:column;min-height:730px}.category-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px}.cat{background:#eaf7fd;border:1px solid transparent;border-radius:10px;padding:9px 4px;font-size:11px;font-weight:850;color:#786875}.cat.active{background:#d8f1fc;border-color:#8fd4ef;color:#783b57}.import-box{margin:0 12px 12px;padding:12px;background:#effaff;border:1px dashed #a9dced;border-radius:14px}.import-box .field{display:flex;gap:8px;align-items:center;margin-bottom:8px}.field label{font-size:10px;color:var(--muted);width:66px;flex:none}.field select,.field input[type=text]{min-width:0;flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:white;color:var(--ink);font-size:11px}.mini{flex:none;padding:7px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:11px;font-weight:800;color:var(--ink)}.mini.danger{color:#a53b5d}.search-field{margin:0 12px 10px}.search-field input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;color:var(--ink);font-size:11px}.file-input{display:none}.upload-label{display:flex;justify-content:center;align-items:center;gap:6px;padding:10px;background:white;border:1px solid var(--line);border-radius:10px;font-size:11px;font-weight:850;color:#7f3f5c;cursor:pointer}.hint{font-size:10px;color:var(--muted);line-height:1.55;margin-top:8px}.library-head{padding:0 16px 9px;display:flex;justify-content:space-between;align-items:center}.asset-list{padding:0 12px 14px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:max-content;align-content:start;gap:8px;overflow:auto;max-height:320px;flex:none}.asset{position:relative;flex:none;border:1px solid var(--line);background:white;border-radius:12px;overflow:hidden;text-align:left;padding:7px;color:var(--ink);min-width:0}.asset.equipped{border:2px solid var(--pink);padding:6px;background:#effaff}.asset img{width:100%;height:100px;object-fit:contain;background:#edf8fc;border-radius:8px;display:block}.asset b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:7px 2px 2px}.asset small{display:block;font-size:9px;color:var(--muted);margin:0 2px}.asset .remove,.asset .rename{position:absolute;top:10px;width:22px;height:22px;border-radius:8px;background:#fff;color:#9c526e;font-weight:900;box-shadow:0 1px 5px #0002}.asset .remove{right:10px}.asset .rename{right:36px;color:#28536a;font-size:12px}.empty-library{grid-column:1/-1;text-align:center;color:var(--muted);font-size:11px;padding:25px 12px;line-height:1.65;background:#f0faff;border-radius:12px}
.bottom-note{margin:0 12px 12px;padding:11px 12px;border-radius:12px;background:#eaf6fb;font-size:10px;color:#716773;line-height:1.55}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#33303a;color:#fff;padding:11px 16px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:10}.toast.show{opacity:1}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.right-panel{grid-column:auto;min-height:0}.asset-list{max-height:320px;grid-template-columns:repeat(3,1fr)}.transform{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:680px){.app{padding:12px}.layout{grid-template-columns:1fr}.stage-panel{min-height:620px}.canvas-wrap{min-height:470px}.right-panel{grid-column:auto}.asset-list{grid-template-columns:repeat(2,1fr);max-height:360px}header{align-items:flex-start;flex-direction:column}.header-actions{justify-content:flex-start}.transform{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header>
 <div><div class="eyebrow">KIVOTOS · STUDENT CUSTOMIZATION SYSTEM</div><div class="brand">Kivotos-Dress-Up</div><div class="sub" data-i18n="sub"></div></div>
 <div class="header-actions">
  <div class="lang" role="group" aria-label="Language"><button id="langKo" class="active">KOR</button><button id="langEn">ENG</button></div>
  <button class="btn" id="exportProject" data-i18n="backup"></button>
  <button class="btn" id="exportDefault" data-i18n="exportDefault"></button>
  <label class="btn" for="importProject" data-i18n="importBackup"></label><input class="file-input" id="importProject" type="file" accept="application/json">
  <input class="name-input" id="exportName" type="text" autocomplete="off" data-i18n-title="exportNameTitle">
  <button class="btn primary" id="exportPng" data-i18n="exportPng"></button>
 </div>
</header>
<div class="layout">
 <main class="panel stage-panel">
  <div class="stage-top"><div class="stage-title" id="stageTitle"></div><button class="btn" id="resetOutfit" data-i18n="resetOutfit"></button></div>
  <div class="canvas-wrap">
   <canvas id="preview" width="768" height="1152"></canvas>
   <div class="empty" id="emptyState"><div class="empty-card"><strong data-i18n="emptyTitle"></strong><p data-i18n-html="emptyBody"></p></div></div>
  </div>
  <div class="canvas-foot"><span id="baseStatus"></span><span id="canvasSizeLabel"></span></div>
  <div class="tip" data-i18n-html="tip"></div>
  <div class="ratio-controls">
   <strong data-i18n="ratioTitle"></strong>
   <select id="ratioPreset" data-i18n-aria="ratioTitle">
    <option value="2:3" data-i18n="ratioDefault"></option><option value="3:4">3 : 4</option><option value="4:5">4 : 5</option><option value="1:1">1 : 1</option><option value="16:9">16 : 9</option><option value="custom" data-i18n="ratioCustom"></option>
   </select>
   <label><span data-i18n="w"></span> <input id="canvasWidth" type="number" min="128" max="2048" value="768"></label>
   <label><span data-i18n="h"></span> <input id="canvasHeight" type="number" min="128" max="2048" value="1152"></label>
   <button class="btn" id="applyRatio" data-i18n="applyRatio"></button>
  </div>
  <section class="layer-panel">
   <div class="layer-heading"><strong data-i18n="layerTitle"></strong><span class="tiny" data-i18n="layerHint"></span></div>
   <div id="layerList" class="layer-list"></div>
  </section>
  <div class="transform" id="transformControls">
   <div class="transform-head">
    <strong id="selName"></strong>
    <label class="lock"><input type="checkbox" id="lockRatio" checked> <span data-i18n="lockRatio"></span></label>
    <button class="btn" id="fitRatio" data-i18n="fitRatio"></button>
    <button class="btn" id="resetPart" data-i18n="resetPart"></button>
   </div>
   <div class="range"><label><span data-i18n="moveX"></span><b id="xVal">0</b></label><input id="offsetX" type="range" min="-1024" max="1024" value="0"></div>
   <div class="range"><label><span data-i18n="moveY"></span><b id="yVal">0</b></label><input id="offsetY" type="range" min="-1024" max="1024" value="0"></div>
   <div class="range"><label><span data-i18n="scaleW"></span><b id="scaleXVal">100%</b></label><input id="scaleX" type="range" min="10" max="400" value="100"></div>
   <div class="range"><label><span data-i18n="scaleH"></span><b id="scaleYVal">100%</b></label><input id="scaleY" type="range" min="10" max="400" value="100"></div>
   <div class="range"><label><span data-i18n="rotate"></span><b id="rotationVal">0°</b></label><input id="rotation" type="range" min="-180" max="180" value="0"></div>
  </div>
 </main>
 <aside class="panel right-panel">
  <div class="panel-head"><div class="panel-title" data-i18n="libTitle"></div><div class="tiny" id="assetCount">0 ITEMS</div></div>
  <div class="category-tabs" id="categoryTabs"></div>
  <div class="import-box">
   <div class="field"><label data-i18n="student"></label><select id="sourceStudent"></select><button class="mini danger" id="deleteStudent" data-i18n="delete" data-i18n-title="deleteTitle"></button></div>
   <div class="field"><label data-i18n="addStudentLabel"></label><input type="text" id="newStudentName" data-i18n-ph="newStudentPh" maxlength="20" autocomplete="off"><button class="mini" id="addStudent" data-i18n="add"></button></div>
   <div class="field"><label data-i18n="fileName"></label><input type="text" id="assetName" data-i18n-ph="fileNamePh" autocomplete="off"></div>
   <label class="upload-label" for="assetFiles" data-i18n="upload"></label><input class="file-input" id="assetFiles" type="file" accept="image/png,image/webp,image/jpeg" multiple>
   <div class="hint" id="uploadHint"></div>
  </div>
  <div class="search-field"><input id="assetSearch" type="search" data-i18n-ph="searchPh" autocomplete="off"></div>
  <div class="library-head"><span class="tiny" id="libraryLabel"></span><span class="tiny" data-i18n="clickEquip"></span></div>
  <div class="asset-list" id="assetList"></div>
  <div class="bottom-note" id="categoryNote" data-i18n="note"></div>
 </aside>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
const STUDENTS=[
 {id:'shiroko',name:'시로코',en:'SHIROKO',mark:'白'},
 {id:'hoshino',name:'호시노',en:'HOSHINO',mark:'星'},
 {id:'serika',name:'세리카',en:'SERIKA',mark:'芹'},
 {id:'nonomi',name:'노노미',en:'NONOMI',mark:'野'},
 {id:'ayane',name:'아야네',en:'AYANE',mark:'綾'},
 {id:'terror',name:'시로코*테러',en:'SHIROKO＊TERROR',mark:'黒'}
];
const EN_NAMES={shiroko:'Shiroko',hoshino:'Hoshino',serika:'Serika',nonomi:'Nonomi',ayane:'Ayane',terror:'Shiroko*Terror'};
const CATS=[
 {id:'face',en:'FACE'},
 {id:'top',en:'TOP'},
 {id:'bottom',en:'BOTTOM'}
];
const ORDER=['face','bottom','top'];
const emptyOutfit=()=>({face:null,top:null,bottom:null,transforms:{},layerOrder:[...ORDER],hiddenLayers:[]});
const blankState=()=>({students:STUDENTS.map(s=>({...s})),assets:[],outfits:Object.fromEntries(STUDENTS.map(s=>[s.id,emptyOutfit()]))});
let state=blankState(),current='shiroko',category='face',selectedCat=null,lang='ko';
let drawSequence=0,scene=[],drag=null;
const imageCache=new Map(),alphaCache=new Map();
const $=id=>document.getElementById(id);

/* ---------- 언어 (KOR / ENG) ---------- */
const I18N={
ko:{
 sub:'학생별 얼굴 · 의상 파츠 조합 · 레이어 편집 · 파츠 직접 변형',
 backup:'개인 백업',exportDefault:'GitHub 기본 데이터 내보내기',importBackup:'백업 불러오기',exportPng:'현재 캐릭터 PNG 저장',
 exportNameTitle:'PNG로 저장할 파일 이름 (비워 두면 자동 이름)',
 resetOutfit:'착장 초기화',
 emptyTitle:'장착된 파츠가 없어요',
 emptyBody:'오른쪽 파츠 라이브러리에서 얼굴·상의·하의 투명 PNG를 등록한 뒤 클릭해 장착하세요.<br>각 파츠를 같은 크기의 캔버스로 만들면 자연스럽게 겹쳐집니다.',
 faceOn:'얼굴 장착됨',faceOff:'얼굴 없음',
 canvasLabel:(w,h)=>`캔버스 ${w} × ${h}`,
 tip:'캔버스에서 파츠를 <b>클릭</b>해 선택 → <b>드래그</b>로 이동 · <b>모서리 점</b>으로 크기 조절(비율 유지 설정 따름) · <b>변 가운데 점</b>으로 가로/세로만 늘이기 · <b>위쪽 동그라미</b>로 회전 (Shift: 15° 단위)',
 ratioTitle:'캔버스 비율',ratioDefault:'2 : 3 (기본)',ratioCustom:'직접 입력',w:'가로',h:'세로',applyRatio:'비율 적용',
 layerTitle:'레이어 순서',layerHint:'위쪽일수록 앞에 표시 · 이름을 누르면 선택',
 editing:(label,eq)=>`편집 중: ${label}${eq?'':' (장착 없음)'}`,
 lockRatio:'비율 유지',fitRatio:'원본 비율로',resetPart:'이 파츠 초기화',
 moveX:'가로 이동',moveY:'세로 이동',scaleW:'가로 크기',scaleH:'세로 크기',rotate:'회전',
 libTitle:'파츠 라이브러리',
 cat_face:'얼굴',cat_top:'상의',cat_bottom:'하의',
 student:'편집 학생',delete:'삭제',deleteTitle:'선택한 학생 삭제',addStudentLabel:'학생 추가',newStudentPh:'새 학생 이름 입력',add:'추가',
 fileName:'파일 이름',fileNamePh:'비우면 (학생)_(파츠) 자동',
 upload:'＋ 투명 PNG 파츠 등록',
 uploadHint:(s,c)=>`${s} 학생의 ${c} 파츠로 등록합니다. 이름은 ${s}_${c} 형식으로 자동 지정되며, 위 칸에 입력하면 그 이름이 쓰입니다.`,
 searchPh:'파일 이름 검색...',allParts:'전체 파츠',results:'검색 결과',clickEquip:'선택하면 즉시 장착',
 note:"작업 내용은 자동 저장되지 않습니다. 새로고침하면 초기화되니 '개인 백업'으로 저장해 두세요.",
 noResults:'검색 결과가 없습니다.',noParts:'등록된 파츠가 없습니다.',checkName:'파일 이름을 확인해 주세요.',uploadAbove:'위에서 이미지 파일을 등록해 주세요.',
 uploadedBy:s=>`${s} 등록`,renameTitle:'이름 변경',removeTitle:'삭제',renamePrompt:'새 파일 이름',renamed:'이름을 변경했습니다.',
 deletedStudent:'삭제된 학생',
 layerEmpty:'장착된 레이어가 없습니다.',hidden:' · 숨김',hide:'숨기기',show:'표시',forward:'앞으로',backward:'뒤로',
 equipped:(s,n)=>`${s}에게 ${n} 장착`,partDeleted:'파츠를 삭제했습니다.',ratioApplied:'캔버스 비율을 적용했습니다.',

 needName:'학생 이름을 입력하세요.',dupName:'이미 같은 이름의 학생이 있습니다.',studentAdded:n=>`${n} 학생을 추가했습니다.`,

 fitDone:'가로·세로 크기를 같게 맞췄습니다.',partReset:'이 파츠의 위치·크기·회전을 초기화했습니다.',outfitReset:'얼굴을 제외한 착장을 초기화했습니다.',
 pngFail:'PNG를 만들지 못했습니다.',defaultToast:'다운로드한 파일을 GitHub 저장소의 data/default-project.json에 넣으세요.',
 imported:'프로젝트를 불러왔습니다.',badBackup:'올바른 프로젝트 백업 파일이 아닙니다.'
},

/* ---------- project data (자동 저장 없음) ---------- */
function normalizeProject(obj){
 if(!obj||!Array.isArray(obj.assets)||!obj.outfits) throw new Error('올바르지 않은 프로젝트 데이터');
 if(!Array.isArray(obj.students)||!obj.students.length) obj.students=STUDENTS.map(s=>({...s}));
 for(const st of obj.students){
  if(!st.id) st.id='custom_'+Math.random().toString(36).slice(2,10);
  if(!st.name) st.name=st.id;
  if(!st.en) st.en=st.name.toUpperCase();
  if(!st.mark) st.mark=[...st.name][0]||'?';
  if(!obj.outfits[st.id]) obj.outfits[st.id]=emptyOutfit();
  const o=obj.outfits[st.id];
  // 예전 분류(베이스/신발/장신구)를 얼굴/상의/하의 체계로 변환: 베이스 → 얼굴
  const mapCat=c=>c==='base'?'face':c;
  if(o.face==null&&o.base!=null)o.face=o.base;
  delete o.base;
  for(const k of ['hair','expression','shoes','accessory'])delete o[k];
  for(const k of ORDER)if(o[k]===undefined)o[k]=null;
  o.transforms=o.transforms||{};
  if(o.transforms.base&&!o.transforms.face)o.transforms.face=o.transforms.base;
  delete o.transforms.base;
  // 예전 형식(scale 하나)을 가로/세로 크기로 변환
  for(const k of Object.keys(o.transforms)){
   const tr=o.transforms[k]||{};
   const legacy=tr.scale!=null?Number(tr.scale):100;
   o.transforms[k]={x:Number(tr.x)||0,y:Number(tr.y)||0,sx:tr.sx!=null?Number(tr.sx):legacy,sy:tr.sy!=null?Number(tr.sy):legacy,rotation:Number(tr.rotation)||0};
  }
  o.layerOrder=[...new Set((Array.isArray(o.layerOrder)?o.layerOrder:[]).map(mapCat))].filter(c=>ORDER.includes(c));
  for(const c of ORDER)if(!o.layerOrder.includes(c))o.layerOrder.push(c);
  o.hiddenLayers=(Array.isArray(o.hiddenLayers)?o.hiddenLayers:[]).map(mapCat).filter(c=>ORDER.includes(c));
 }
 obj.assets=obj.assets.filter(a=>a&&a.id&&a.category&&a.owner&&a.data);
 for(const a of obj.assets)if(a.category==='base')a.category='face';
 return obj;
}
async function restore(){
 // GitHub Pages 등에서 공유 기본 라이브러리를 불러옵니다. 실패하면 빈 상태로 시작합니다.
 try{const response=await fetch('./data/default-project.json?_='+Date.now(),{cache:'reload',headers:{'Cache-Control':'no-cache',Pragma:'no-cache'}});if(response.ok)state=normalizeProject(await response.json());}
 catch(e){state=blankState();}
 if(!students().some(s=>s.id===current)) current=students()[0]?.id||'shiroko';
 selectedCat=equippedId(category)?category:null;
 renderAll();
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function getImage(asset){if(imageCache.has(asset.id))return imageCache.get(asset.id);const promise=new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=asset.data});imageCache.set(asset.id,promise);return promise}

/* ---------- 그리기 ---------- */
async function composeScene(){
 const outfit=state.outfits[current],order=Array.isArray(outfit.layerOrder)?outfit.layerOrder:ORDER;
 const layers=order.map(cat=>({cat,asset:assetById(equippedId(cat))})).filter(x=>x.asset&&!(outfit.hiddenLayers||[]).includes(x.cat));
 const imgs=await Promise.all(layers.map(l=>getImage(l.asset).catch(()=>null)));
 return layers.map((l,i)=>({...l,img:imgs[i]})).filter(l=>l.img);
}
function geomOf(cat,img,cw,ch){
 const tr=getT(cat),fit=Math.min(cw/img.naturalWidth,ch/img.naturalHeight);
 const bw=img.naturalWidth*fit,bh=img.naturalHeight*fit;
 return {cx:cw/2+tr.x,cy:ch/2+tr.y,w:bw*tr.sx/100,h:bh*tr.sy/100,bw,bh,rot:tr.rotation};
}
function paintLayers(ctx,cw,ch,sc){
 ctx.clearRect(0,0,cw,ch);
 for(const l of sc){
  const g=geomOf(l.cat,l.img,cw,ch);
  ctx.save();ctx.translate(g.cx,g.cy);ctx.rotate(g.rot*Math.PI/180);
  ctx.drawImage(l.img,-g.w/2,-g.h/2,g.w,g.h);ctx.restore();
 }
}
const HANDLES={nw:[-1,-1],ne:[1,-1],se:[1,1],sw:[-1,1],n:[0,-1],e:[1,0],s:[0,1],w:[-1,0]};
const CURSORS={nw:'nwse-resize',se:'nwse-resize',ne:'nesw-resize',sw:'nesw-resize',n:'ns-resize',s:'ns-resize',e:'ew-resize',w:'ew-resize',rot:'grab'};
const ROT_OFF=30;
function displayScale(){const c=$('preview'),w=c.getBoundingClientRect().width;return w>0?c.width/w:1}
function drawSelection(ctx){
 if(!selectedCat)return;
 const l=scene.find(x=>x.cat===selectedCat);if(!l)return;
 const c=$('preview'),k=displayScale(),g=geomOf(l.cat,l.img,c.width,c.height);
 ctx.save();ctx.translate(g.cx,g.cy);ctx.rotate(g.rot*Math.PI/180);
 ctx.lineWidth=1.5*k;ctx.strokeStyle='#42a9d8';ctx.setLineDash([6*k,4*k]);ctx.strokeRect(-g.w/2,-g.h/2,g.w,g.h);ctx.setLineDash([]);
 ctx.beginPath();ctx.moveTo(0,-g.h/2);ctx.lineTo(0,-g.h/2-ROT_OFF*k);ctx.stroke();
 ctx.fillStyle='#fff';ctx.lineWidth=2*k;
 const s=8*k;
 for(const [hx,hy] of Object.values(HANDLES)){ctx.beginPath();ctx.rect(hx*g.w/2-s/2,hy*g.h/2-s/2,s,s);ctx.fill();ctx.stroke();}
 ctx.beginPath();ctx.arc(0,-g.h/2-ROT_OFF*k,6*k,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.restore();
}
async function draw(){
 const seq=++drawSequence,canvas=$('preview'),ctx=canvas.getContext('2d');
 const sc=await composeScene();
 if(seq!==drawSequence)return;
 scene=sc;
 paintLayers(ctx,canvas.width,canvas.height,sc);
 drawSelection(ctx);
 const anyEquipped=ORDER.some(c=>assetById(equippedId(c))),hasFace=!!assetById(equippedId('face'));
 $('emptyState').style.display=anyEquipped?'none':'flex';
 $('baseStatus').textContent=hasFace?t('faceOn'):t('faceOff');$('baseStatus').style.color=hasFace?'#27845f':'#b65b7b';
 $('exportName').placeholder=defaultExportName()+'.png';
}

/* ---------- 파일 이름 ---------- */
function sanitizeName(s){return String(s).replace(/[\\/:*?"<>|\u0000-\u001f]+/g,'_').trim()}
function defaultExportName(){
 const o=state.outfits[current],hidden=o.hiddenLayers||[];
 const parts=['face','top','bottom'].filter(c=>equippedId(c)&&!hidden.includes(c)).map(catLabel);
 return sanitizeName([studentName(current),...parts].join('_'));
}
function uniqueName(base){
 const used=new Set(state.assets.map(a=>a.name));
 if(!used.has(base))return base;
 let n=2;while(used.has(`${base}_${n}`))n++;
 return `${base}_${n}`;
}
function autoAssetName(owner,cat){return uniqueName(`${studentName(owner)}_${catLabel(cat)}`)}
function renameAsset(id){
 const a=assetById(id);if(!a)return;
 const v=prompt(t('renamePrompt'),a.name);if(v===null)return;
 const n=v.trim();if(!n)return;
 a.name=n;renderAssets();toast(t('renamed'));
}

function renderLayers(){

 if(!equipped.length){$('layerList').innerHTML=`<div class="layer-empty">${t('layerEmpty')}</div>`;return;}
 $('layerList').innerHTML=[...equipped].reverse().map(cat=>{

 }).join('');
 document.querySelectorAll('[data-layer-sel]').forEach(b=>b.onclick=()=>setCategory(b.dataset.layerSel));
 document.querySelectorAll('[data-layer-vis]').forEach(b=>b.onclick=()=>{const c=b.dataset.layerVis;outfit.hiddenLayers=outfit.hiddenLayers||[];outfit.hiddenLayers=outfit.hiddenLayers.includes(c)?outfit.hiddenLayers.filter(x=>x!==c):[...outfit.hiddenLayers,c];renderLayers();draw()});
 document.querySelectorAll('[data-layer-up]').forEach(b=>b.onclick=()=>moveLayer(b.dataset.layerUp,1));

function moveLayer(cat,delta){const o=state.outfits[current];o.layerOrder=o.layerOrder||[...ORDER];const i=o.layerOrder.indexOf(cat),j=i+delta;if(i<0||j<0||j>=o.layerOrder.length)return;[o.layerOrder[i],o.layerOrder[j]]=[o.layerOrder[j],o.layerOrder[i]];renderLayers();draw()}

function applyCanvasSize(w,h){
 w=Math.max(128,Math.min(2048,Math.round(Number(w)||768)));
 h=Math.max(128,Math.min(2048,Math.round(Number(h)||1152)));
 const c=$('preview');c.width=w;c.height=h;
 $('canvasWidth').value=w;$('canvasHeight').value=h;
 $('canvasSizeLabel').textContent=t('canvasLabel',w,h);
 c.style.setProperty('--canvas-ratio',`${w}/${h}`);
 draw();
}
$('ratioPreset').onchange=()=>{
 const v=$('ratioPreset').value;if(v==='custom')return;
 const [rw,rh]=v.split(':').map(Number),base=768;
 let w=base,h=Math.round(base*rh/rw);
 if(h>2048){h=2048;w=Math.round(h*rw/rh)}
 $('canvasWidth').value=w;$('canvasHeight').value=h;applyCanvasSize(w,h);
};
$('applyRatio').onclick=()=>{applyCanvasSize($('canvasWidth').value,$('canvasHeight').value);$('ratioPreset').value='custom';toast(t('ratioApplied'))};

$('assetFiles').addEventListener('change',async e=>{
 const files=[...e.target.files];if(!files.length)return;
 const owner=current,cat=category,custom=sanitizeName($('assetName').value);
 let added=0;
 for(const f of files){
  if(!f.type.startsWith('image/'))continue;
  const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
  const name=custom?uniqueName(custom):autoAssetName(owner,cat);
  state.assets.push({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(16).slice(2)),category:cat,owner,name,data});
  added++;
 }
 renderAssets();e.target.value='';$('assetName').value='';toast(t('uploaded',added));
});

function addStudent(){
 const name=$('newStudentName').value.trim();
 if(!name){toast(t('needName'));return;}
 if(students().some(s=>s.name===name||nameOf(s)===name)){toast(t('dupName'));return;}
 const id='custom_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 state.students.push({id,name,en:name.toUpperCase(),mark:[...name][0]||'?',school:''});
 state.outfits[id]=emptyOutfit();
 current=id;selectedCat=null;
 $('newStudentName').value='';
 renderAll();toast(t('studentAdded',name));
}
$('addStudent').onclick=addStudent;

const cv=$('preview');
function canvasPoint(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height,k:cv.width/r.width}}
function toLocal(g,p){const dx=p.x-g.cx,dy=p.y-g.cy,a=-g.rot*Math.PI/180,c=Math.cos(a),s=Math.sin(a);return {x:dx*c-dy*s,y:dx*s+dy*c}}
function toCanvasPt(g,l){const a=g.rot*Math.PI/180,c=Math.cos(a),s=Math.sin(a);return {x:g.cx+l.x*c-l.y*s,y:g.cy+l.x*s+l.y*c}}
function alphaAt(asset,img,u,v){
 let a=alphaCache.get(asset.id);
 if(!a){
  const k=Math.min(1,512/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.max(1,Math.round(img.naturalWidth*k)),h=Math.max(1,Math.round(img.naturalHeight*k));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0,w,h);
  try{a={w,h,d:cx.getImageData(0,0,w,h).data}}catch(e){a={w,h,d:null}}
  alphaCache.set(asset.id,a);
 }
 if(!a.d)return true;
 const x=Math.min(a.w-1,Math.max(0,Math.floor(u*a.w))),y=Math.min(a.h-1,Math.max(0,Math.floor(v*a.h)));
 return a.d[(y*a.w+x)*4+3]>16;
}
function hitLayer(p){
 for(let i=scene.length-1;i>=0;i--){
  const l=scene[i],g=geomOf(l.cat,l.img,cv.width,cv.height),q=toLocal(g,p);
  if(Math.abs(q.x)>g.w/2||Math.abs(q.y)>g.h/2)continue;
  if(alphaAt(l.asset,l.img,q.x/g.w+.5,q.y/g.h+.5))return l.cat;
 }
 return null;
}
function insideBox(g,p){const q=toLocal(g,p);return Math.abs(q.x)<=g.w/2&&Math.abs(q.y)<=g.h/2}
function hitHandle(g,p){
 const q=toLocal(g,p),r=12*p.k;
 if(Math.hypot(q.x,q.y+g.h/2+ROT_OFF*p.k)<r)return 'rot';
 for(const [n,[hx,hy]] of Object.entries(HANDLES))if(Math.hypot(q.x-hx*g.w/2,q.y-hy*g.h/2)<r)return n;
 return null;
}
function selLayer(){return selectedCat?scene.find(x=>x.cat===selectedCat):null}
function selectLayer(cat){category=cat;selectedCat=cat;renderCats();renderAssets();updateHint();setTransformUI();renderLayers()}
function beginDrag(e,mode,cat,g,p){drag={mode,cat,g,p0:p,t0:getT(cat)};try{cv.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()}
cv.addEventListener('pointerdown',e=>{
 if(e.button>0)return;
 const p=canvasPoint(e),sel=selLayer();
 let selG=null;
 if(sel){selG=geomOf(sel.cat,sel.img,cv.width,cv.height);const h=hitHandle(selG,p);if(h){beginDrag(e,h,sel.cat,selG,p);return}}
 const hit=hitLayer(p);
 if(hit){
  if(hit!==selectedCat||hit!==category)selectLayer(hit);
  const l=scene.find(x=>x.cat===hit);
  beginDrag(e,'move',hit,geomOf(l.cat,l.img,cv.width,cv.height),p);draw();return;
 }
 if(sel&&selG&&insideBox(selG,p)){beginDrag(e,'move',sel.cat,selG,p);return}
 selectedCat=null;renderLayers();draw();
});
cv.addEventListener('pointermove',e=>{
 const p=canvasPoint(e);
 if(!drag){
  let cur='default';const sel=selLayer();
  if(sel){const g=geomOf(sel.cat,sel.img,cv.width,cv.height),h=hitHandle(g,p);if(h)cur=CURSORS[h];else if(hitLayer(p)||insideBox(g,p))cur='move';}
  else if(hitLayer(p))cur='move';
  cv.style.cursor=cur;return;
 }
 const g=drag.g,tr=editT(drag.cat);
 if(drag.mode==='move'){
  tr.x=Math.round(drag.t0.x+p.x-drag.p0.x);tr.y=Math.round(drag.t0.y+p.y-drag.p0.y);
 }else if(drag.mode==='rot'){
  let ang=Math.atan2(p.y-g.cy,p.x-g.cx)*180/Math.PI+90;
  if(e.shiftKey)ang=Math.round(ang/15)*15;
  ang=((ang+180)%360+360)%360-180;
  tr.rotation=Math.round(ang*10)/10;
 }else{
  const [hx,hy]=HANDLES[drag.mode],q=toLocal(g,p);
  let nw=g.w,nh=g.h,ax=0,ay=0;
  if(hx!==0){ax=-hx*g.w/2;nw=Math.max(8,(q.x-ax)*hx)}
  if(hy!==0){ay=-hy*g.h/2;nh=Math.max(8,(q.y-ay)*hy)}
  if(hx!==0&&hy!==0&&$('lockRatio').checked){const k=Math.max(nw/g.w,nh/g.h);nw=g.w*k;nh=g.h*k}
  const lc={x:hx!==0?ax+hx*nw/2:0,y:hy!==0?ay+hy*nh/2:0};
  const c=toCanvasPt(g,lc);
  tr.x=Math.round(c.x-cv.width/2);tr.y=Math.round(c.y-cv.height/2);
  tr.sx=clampS(Math.round(nw/g.bw*1000)/10);tr.sy=clampS(Math.round(nh/g.bh*1000)/10);
 }
 setTransformUI();draw();
});
const endDrag=e=>{if(drag){try{cv.releasePointerCapture(e.pointerId)}catch(_){}drag=null}};
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);

/* ---------- 초기화 / 내보내기 / 불러오기 ---------- */
$('resetOutfit').onclick=()=>{
 const old=state.outfits[current],keep=old.transforms.face?{face:old.transforms.face}:{};
 state.outfits[current]={...emptyOutfit(),face:old.face,transforms:keep};
 selectedCat=equippedId(category)&&category==='face'?'face':null;
 renderAll();toast(t('outfitReset'));
};
$('exportPng').onclick=async()=>{
 const sc=await composeScene(),off=document.createElement('canvas');
 off.width=cv.width;off.height=cv.height;
 paintLayers(off.getContext('2d'),off.width,off.height,sc);
 const typed=sanitizeName($('exportName').value.replace(/\.png$/i,''));
 const fname=(typed||defaultExportName()||'character')+'.png';
 off.toBlob(blob=>{if(!blob){toast(t('pngFail'));return;}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/png');
};
function downloadProject(filename){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('exportProject').onclick=()=>downloadProject('kivotos_dress_up_backup.json');
$('exportDefault').onclick=()=>{downloadProject('default-project.json');toast(t('defaultToast'))};
$('importProject').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  const obj=normalizeProject(JSON.parse(await f.text()));
  state=obj;imageCache.clear();alphaCache.clear();
  if(!students().some(s=>s.id===current))current=students()[0].id;
  selectedCat=equippedId(category)?category:null;
  renderAll();toast(t('imported'));
 }catch(err){toast(t('badBackup'))}
 e.target.value='';
};
$('langKo').onclick=()=>setLang('ko');
$('langEn').onclick=()=>setLang('en');
applyStatic();
restore();
